resources:
  jobs:
    dev_admin_citibike_etl_pipeline_nb:
      name: citibike_etl_pipeline_nb
      max_concurrent_runs: 4
      tasks:
        - task_key: 00_whl_task
          python_wheel_task:
            package_name: dab_project
            entry_point: main
          environment_key: citibike_environment
        - task_key: 01_bronze_citibike
          depends_on:
            - task_key: 00_whl_task
          notebook_task:
            notebook_path: ../citibike_etl/notebooks/01_bronze/01_bronze_citibike.ipynb
            base_parameters:
              catalog: ${var.catalog}
              pipeline_id: "{{job.id}}"
              processed_timestamp: "{{job.start_time.iso_datetime}}"
              run_id: "{{job.run_id}}"
              task_id: "{{task.run_id}}"
            source: WORKSPACE
          environment_key: citibike_environment
        - task_key: 02_silver_citibike
          depends_on:
            - task_key: 01_bronze_citibike
          notebook_task:
            notebook_path: ../citibike_etl/notebooks/02_silver/02_silver_citibike.ipynb
            base_parameters:
              catalog: ${var.catalog}
              pipeline_id: "{{job.id}}"
              processed_timestamp: "{{job.start_time.iso_datetime}}"
              run_id: "{{job.run_id}}"
              task_id: "{{task.run_id}}"
            source: WORKSPACE
          environment_key: citibike_environment
        - task_key: 03_gold_citibike_daily_ride_summary
          depends_on:
            - task_key: 02_silver_citibike
          notebook_task:
            notebook_path: ../citibike_etl/notebooks/03_gold/03_gold_citibike_daily_ride_summary.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
          environment_key: citibike_environment
        - task_key: 03_gold_citibike_station_performance
          depends_on:
            - task_key: 02_silver_citibike
          notebook_task:
            notebook_path: ../citibike_etl/notebooks/03_gold/03_gold_citibike_station_performance.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
          environment_key: citibike_environment
      tags:
        ${var.environment}: admin
      queue:
        enabled: true
      environments:
        - environment_key: citibike_environment
          spec:
            dependencies:
              - ../dist/dab_project-0.0.1-py3-none-any.whl
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
